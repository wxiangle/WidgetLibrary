plugins {
    id 'com.android.application'
}

def fresco_version = "2.3.0"

android {
    namespace 'org.aaron.widgetlibrary'
    compileSdk 36

    defaultConfig {
        applicationId "org.aaron.widgetlibrary"
        minSdk 21
        targetSdk 36
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        viewBinding true
    }
}

dependencies {

    implementation 'androidx.appcompat:appcompat:1.4.0'
    implementation 'androidx.core:core-ktx:1.7.0'
    implementation 'com.google.android.material:material:1.4.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation project(path: ':mylibrary')

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.6.1'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'

    implementation 'com.github.lihangleo2:ShadowLayout:3.2.4'

    implementation "com.facebook.fresco:fresco:$fresco_version"
    // 支持 GIF 动图，需要添加
    implementation "com.facebook.fresco:animated-gif:$fresco_version"
    // 支持 WebP（静态图+动图），需要添加
    implementation "com.facebook.fresco:animated-webp:$fresco_version"
    implementation "com.facebook.fresco:webpsupport:$fresco_version"

    implementation 'com.github.bumptech.glide:glide:4.12.0'
    implementation "com.github.zjupure:webpdecoder:2.2.4.12.0"
}
