plugins {
    id 'com.android.application'
    id 'kotlin-android'
    id 'kotlin-kapt'
    id 'kotlin-android-extensions'
}
def fresco_version = "2.3.0"
android {
    compileSdkVersion 31
    buildToolsVersion "31.0.0"

    defaultConfig {
        applicationId "org.aaron.widgetlibrary"
        minSdkVersion 19
        targetSdkVersion 31
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "android.support.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
}

dependencies {

    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
    implementation 'com.android.support.constraint:constraint-layout:2.0.4'
    implementation 'androidx.appcompat:appcompat:1.4.0'
    implementation 'androidx.core:core-ktx:1.7.0'
    implementation 'com.google.android.material:material:1.4.0'
    implementation project(path: ':mylibrary')
    testImplementation 'junit:junit:4.+'
    androidTestImplementation 'com.android.support.test:runner:1.0.2'
    androidTestImplementation 'com.android.support.test.espresso:espresso-core:3.0.2'
    implementation 'com.github.lihangleo2:ShadowLayout:3.2.4'

    implementation "com.facebook.fresco:fresco:$fresco_version"
    // 支持 GIF 动图，需要添加
    implementation "com.facebook.fresco:animated-gif:$fresco_version"

    // 支持 WebP （静态图+动图），需要添加
    implementation "com.facebook.fresco:animated-webp:$fresco_version"
    implementation "com.facebook.fresco:webpsupport:$fresco_version"

    // 仅支持 WebP 静态图，需要添加
    implementation "com.facebook.fresco:webpsupport:$fresco_version"

    implementation 'com.github.bumptech.glide:glide:4.12.0'
    annotationProcessor "com.github.bumptech.glide:compiler:4.12.0"
    kapt 'com.github.bumptech.glide:compiler:4.12.0'
    implementation "com.github.zjupure:webpdecoder:2.2.4.12.0"
//    implementation 'jp.wasabeef:glide-transformations:3.0.1'
//
}